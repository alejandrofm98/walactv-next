services:
  web:
    ports:
      - "127.0.0.1:8081:80"

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${LOCAL_POSTGRES_DB:?Configura el entorno local con scripts/setup-local.sh}
      POSTGRES_USER: ${LOCAL_POSTGRES_USER:?Configura el entorno local con scripts/setup-local.sh}
      POSTGRES_PASSWORD: ${LOCAL_POSTGRES_PASSWORD:?Configura el entorno local con scripts/setup-local.sh}
    volumes:
      - walactv-local-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  migrate:
    environment:
      DATABASE_URL: postgres://${LOCAL_POSTGRES_USER}:${LOCAL_POSTGRES_PASSWORD}@postgres:5432/${LOCAL_POSTGRES_DB}?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy

  bootstrap-admin:
    environment:
      DATABASE_URL: postgres://${LOCAL_POSTGRES_USER}:${LOCAL_POSTGRES_PASSWORD}@postgres:5432/${LOCAL_POSTGRES_DB}?sslmode=disable

  api:
    environment:
      DATABASE_URL: postgres://${LOCAL_POSTGRES_USER}:${LOCAL_POSTGRES_PASSWORD}@postgres:5432/${LOCAL_POSTGRES_DB}?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      bootstrap-admin:
        condition: service_completed_successfully

volumes:
  walactv-local-postgres-data:
