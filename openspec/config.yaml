schema: spec-driven

context: |
  Language: es
  All artifacts must be written in es.
  Keep OpenSpec structural headings and SHALL/MUST keywords in English.
  Lee AGENTS.md y docs/deployment.md antes de planificar o implementar.
  Proyecto nuevo: API Go y frontend Angular standalone completamente nuevos.
  No hay compatibilidad ni importación legacy exigidas para el MVP local.
  PostgreSQL de producción es externa a Compose; no usar datos de producción.
  No incluir secretos. Publicar exige autorización y destino verificado.

# Per-artifact rules (optional)
# Add custom rules for specific artifacts.
# Example:
#   rules:
#     proposal:
#       - Keep proposals under 500 words
#       - Always state what is out of scope
#     tasks:
#       - Break tasks into chunks of max 2 hours

# Per-operation guidance (optional)
# Add advisory guidance for how apply and archive work should be conducted.
# This is separate from artifact rules above.
# Example:
#   operations:
#     apply:
#       guidance:
#         - Keep test summaries concise
#     archive:
#       guidance:
#         - Summarize the archive outcome before finishing
